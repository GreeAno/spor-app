<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Спор — Бросай вызов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0d0d0d;
    --white: #f5f2eb;
    --accent: #e8ff47;
    --accent2: #ff4f4f;
    --gray: #1a1a1a;
    --gray2: #252525;
    --border: rgba(245,242,235,0.1);
    --muted: rgba(245,242,235,0.5);
  }
  html, body { height: 100%; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Onest', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* UTILS */
  .hidden { display: none !important; }
  .accent { color: var(--accent); }

  /* LOADING */
  #loading {
    position: fixed; inset: 0;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    flex-direction: column; gap: 16px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* AUTH */
  #auth-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-box {
    width: 100%; max-width: 380px;
    background: var(--gray);
    border-radius: 20px;
    padding: 36px 28px;
    border: 1px solid var(--border);
  }
  .auth-logo {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .auth-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .auth-tabs {
    display: flex;
    background: var(--gray2);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .auth-tab {
    flex: 1; padding: 8px;
    border: none; background: transparent;
    color: var(--muted);
    font-family: 'Onest', sans-serif;
    font-size: 13px; font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all .2s;
  }
  .auth-tab.active {
    background: var(--accent);
    color: var(--black);
  }

  /* FORM ELEMENTS */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--gray2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--white);
    font-family: 'Onest', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    resize: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: rgba(232,255,71,0.4);
  }
  .field input::placeholder, .field textarea::placeholder {
    color: rgba(245,242,235,0.2);
  }
  .field select option { background: #1a1a1a; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-accent { background: var(--accent); color: var(--black); }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,255,71,0.25); }
  .btn-accent:active { transform: none; }
  .btn-ghost {
    background: var(--gray2);
    color: var(--white);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: rgba(245,242,235,0.3); }
  .btn-danger { background: rgba(255,79,79,0.15); color: var(--accent2); border: 1px solid rgba(255,79,79,0.2); }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .error-msg {
    background: rgba(255,79,79,0.1);
    border: 1px solid rgba(255,79,79,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ff6b6b;
    margin-bottom: 14px;
  }
  .success-msg {
    background: rgba(232,255,71,0.1);
    border: 1px solid rgba(232,255,71,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 14px;
  }

  /* APP LAYOUT */
  #app { display: none; min-height: 100vh; padding-bottom: 80px; }

  /* TOP NAV */
  .top-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13,13,13,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-nav-logo {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--accent);
  }
  .top-nav-user {
    font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
  }
  .logout-btn {
    background: none; border: none;
    color: var(--muted); font-size: 12px;
    cursor: pointer; padding: 4px 8px;
    border-radius: 6px;
    transition: color .2s;
  }
  .logout-btn:hover { color: var(--white); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 20px;
    z-index: 50;
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    padding: 6px;
    cursor: pointer;
    transition: color .2s;
    color: var(--muted);
    border: none; background: none;
    font-family: 'Onest', sans-serif;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-label { font-size: 10px; font-weight: 500; }

  /* SCREENS */
  .screen { padding: 20px; max-width: 480px; margin: 0 auto; }

  /* SECTION TITLE */
  .screen-title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
  }

  /* CHALLENGE CARDS */
  .challenge-list { display: flex; flex-direction: column; gap: 12px; }

  .challenge-card {
    background: var(--gray);
    border-radius: 16px;
    padding: 18px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .challenge-card:hover { border-color: rgba(232,255,71,0.2); transform: translateY(-1px); }
  .challenge-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity .2s;
  }
  .challenge-card:hover::before { opacity: 1; }

  .ch-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .ch-card-title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    line-height: 1.3;
    flex: 1;
    margin-right: 10px;
  }
  .ch-card-status {
    font-size: 10px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 100px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-active { background: rgba(232,255,71,0.12); color: var(--accent); border: 1px solid rgba(232,255,71,0.2); }
  .status-done { background: rgba(245,242,235,0.06); color: var(--muted); border: 1px solid var(--border); }
  .status-my { background: rgba(100,180,255,0.12); color: #64b4ff; border: 1px solid rgba(100,180,255,0.2); }

  .ch-card-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .ch-card-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .ch-card-meta span { display: flex; align-items: center; gap: 4px; }

  /* PROGRESS BAR */
  .progress-wrap { margin: 10px 0; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 100px; transition: width .5s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-title { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
  .empty-desc { font-size: 13px; line-height: 1.6; }

  /* DETAIL SCREEN */
  .detail-header {
    margin-bottom: 20px;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    background: none; border: none; cursor: pointer;
    padding: 0; margin-bottom: 16px;
    transition: color .2s;
  }
  .back-btn:hover { color: var(--white); }

  .detail-title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900; font-size: 24px;
    letter-spacing: -0.03em; line-height: 1.2;
    margin-bottom: 8px;
  }
  .detail-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }

  .meta-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .meta-chip {
    background: var(--gray2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    display: flex; align-items: center; gap: 5px;
  }
  .meta-chip.stake { border-color: rgba(255,79,79,0.3); color: #ff7070; background: rgba(255,79,79,0.08); }

  /* PARTICIPANTS */
  .participants-section { margin-bottom: 20px; }
  .section-label {
    font-size: 11px; font-weight: 500;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px;
  }
  .participant-row {
    display: flex; align-items: center;
    gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .participant-row:last-child { border-bottom: none; }
  .participant-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gray2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--black);
    flex-shrink: 0;
  }
  .participant-name { flex: 1; font-size: 14px; font-weight: 500; }
  .participant-streak {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 4px;
  }
  .streak-fire { color: var(--accent); }

  /* CHECKIN BUTTON */
  .checkin-section {
    background: var(--gray);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    text-align: center;
  }
  .checkin-title { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .checkin-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .checkin-done {
    font-size: 13px; color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px;
  }

  /* SHARE */
  .share-box {
    background: var(--gray2);
    border-radius: 12px;
    padding: 14px;
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .share-url {
    flex: 1; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .share-copy {
    background: var(--accent); color: var(--black);
    border: none; border-radius: 8px;
    padding: 6px 12px;
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: transform .15s;
    flex-shrink: 0;
  }
  .share-copy:hover { transform: scale(1.04); }

  /* CREATE FORM */
  .create-form { max-width: 480px; margin: 0 auto; }
  .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .day-btn {
    padding: 10px 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--gray2);
    color: var(--muted);
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 700;
    cursor: pointer; text-align: center;
    transition: all .15s;
  }
  .day-btn.selected { background: var(--accent); color: var(--black); border-color: var(--accent); }

  /* PROFILE */
  .profile-header {
    background: var(--gray);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border);
    text-align: center;
    margin-bottom: 20px;
  }
  .profile-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--black);
    font-family: 'Unbounded', sans-serif;
    font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
  }
  .profile-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .profile-email { font-size: 13px; color: var(--muted); }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-box {
    background: var(--gray);
    border-radius: 12px;
    padding: 16px 10px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .stat-num { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 22px; margin-bottom: 4px; }
  .stat-label { font-size: 11px; color: var(--muted); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--gray2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity .3s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* JOIN SCREEN */
  #join-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .join-box {
    width: 100%; max-width: 380px;
    background: var(--gray);
    border-radius: 20px;
    padding: 32px 24px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .join-emoji { font-size: 48px; margin-bottom: 16px; }
  .join-title { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 20px; margin-bottom: 8px; }
  .join-desc { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

  @media (max-width: 380px) {
    .screen { padding: 16px; }
    .detail-title { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--muted);">Загружаем...</div>
</div>

<!-- AUTH -->
<div id="auth-screen" class="hidden">
  <div class="auth-box">
    <div class="auth-logo">спор.</div>
    <div class="auth-sub">Бросай вызов. Держи слово.</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Войти</button>
      <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div id="auth-error" class="error-msg hidden"></div>
    <div id="auth-success" class="success-msg hidden"></div>

    <div id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="твой@email.ru"></div>
      <div class="field"><label>Пароль</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <button class="btn btn-accent" onclick="login()">Войти →</button>
    </div>

    <div id="register-form" class="hidden">
      <div class="field"><label>Имя</label><input type="text" id="reg-name" placeholder="Как тебя зовут?"></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="твой@email.ru"></div>
      <div class="field"><label>Пароль</label><input type="password" id="reg-password" placeholder="Минимум 6 символов"></div>
      <button class="btn btn-accent" onclick="register()">Создать аккаунт →</button>
    </div>
  </div>
</div>

<!-- JOIN SCREEN (for invite links) -->
<div id="join-screen" class="hidden">
  <div class="join-box">
    <div class="join-emoji">🏆</div>
    <div class="join-title" id="join-challenge-title">Загружаем...</div>
    <div class="join-desc" id="join-challenge-desc"></div>
    <div id="join-meta" style="margin-bottom:20px;"></div>
    <div id="join-error" class="error-msg hidden"></div>
    <button class="btn btn-accent" id="join-btn" onclick="joinChallenge()">Принять вызов →</button>
    <div style="margin-top:12px;font-size:12px;color:var(--muted);">Нужна регистрация для участия</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="top-nav">
    <div class="top-nav-logo">спор.</div>
    <div class="top-nav-user">
      <span id="nav-username"></span>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
  </div>

  <!-- SCREENS -->
  <div id="screen-home" class="screen hidden">
    <div class="screen-title">Мои челленджи</div>
    <div id="home-list" class="challenge-list"></div>
  </div>

  <div id="screen-explore" class="screen hidden">
    <div class="screen-title">Все челленджи</div>
    <div id="explore-list" class="challenge-list"></div>
  </div>

  <div id="screen-create" class="screen hidden">
    <div class="screen-title">Новый вызов</div>
    <div class="create-form">
      <div id="create-error" class="error-msg hidden"></div>
      <div class="field">
        <label>Название</label>
        <input type="text" id="c-title" placeholder="Бегать каждое утро">
      </div>
      <div class="field">
        <label>Описание и правила</label>
        <textarea id="c-desc" rows="3" placeholder="Минимум 2 км до 9:00, подтверждение — скриншот из трекера"></textarea>
      </div>
      <div class="field">
        <label>Срок (дней)</label>
        <div class="days-grid">
          <button class="day-btn" onclick="selectDays(7, this)">7</button>
          <button class="day-btn selected" onclick="selectDays(14, this)">14</button>
          <button class="day-btn" onclick="selectDays(30, this)">30</button>
          <button class="day-btn" onclick="selectDays(60, this)">60</button>
        </div>
      </div>
      <div class="field">
        <label>Ставка (₽) — необязательно</label>
        <input type="number" id="c-stake" placeholder="500" min="0">
      </div>
      <button class="btn btn-accent" onclick="createChallenge()">Создать вызов →</button>
    </div>
  </div>

  <div id="screen-detail" class="screen hidden"></div>

  <div id="screen-profile" class="screen hidden"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showScreen('home')" id="nav-home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Мои</span>
    </button>
    <button class="nav-item" onclick="showScreen('explore')" id="nav-explore">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="nav-label">Все</span>
    </button>
    <button class="nav-item" onclick="showScreen('create')" id="nav-create">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span class="nav-label">Создать</span>
    </button>
    <button class="nav-item" onclick="showScreen('profile')" id="nav-profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Профиль</span>
    </button>
  </nav>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<script>
const URL  = 'https://nyivjcppdbvtjwfmutao.supabase.co';
const KEY  = 'sb_publishable_TpWFvJagIIjFGXozUq5uJA_AbQq9RZt';

let currentUser = null;
let currentProfile = null;
let selectedDays = 14;
let joinChallengeId = null;
let accessToken = null;

function authHeaders() {
  const h = { 'Content-Type': 'application/json', 'apikey': KEY, 'Prefer': 'return=representation' };
  if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
  return h;
}

async function dbGet(table, filters) {
  filters = filters || '';
  const r = await fetch(URL + '/rest/v1/' + table + '?' + filters, { headers: authHeaders() });
  return r.json();
}

async function dbGetOne(table, filters) {
  const data = await dbGet(table, filters);
  return Array.isArray(data) ? data[0] : data;
}

async function dbInsert(table, body) {
  const r = await fetch(URL + '/rest/v1/' + table, {
    method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Insert error'); }
  const text = await r.text();
  return text ? JSON.parse(text) : {};
}

async function dbUpsert(table, body) {
  const h = Object.assign({}, authHeaders(), {'Prefer': 'resolution=merge-duplicates,return=representation'});
  const r = await fetch(URL + '/rest/v1/' + table, {
    method: 'POST', headers: h, body: JSON.stringify(body)
  });
  const text = await r.text();
  return text ? JSON.parse(text) : {};
}

async function dbCount(table, filters) {
  filters = filters || '';
  const h = Object.assign({}, authHeaders(), {'Prefer': 'count=exact'});
  const r = await fetch(URL + '/rest/v1/' + table + '?' + filters, { method: 'HEAD', headers: h });
  const cr = r.headers.get('content-range');
  return parseInt((cr && cr.split('/')[1]) || '0');
}

async function authSignUp(email, password) {
  const r = await fetch(URL + '/auth/v1/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': KEY },
    body: JSON.stringify({ email: email, password: password })
  });
  return r.json();
}

async function authSignIn(email, password) {
  const r = await fetch(URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': KEY },
    body: JSON.stringify({ email: email, password: password })
  });
  return r.json();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  joinChallengeId = params.get('join');
  let session = null;
  try { session = JSON.parse(localStorage.getItem('spor_session')); } catch(e) {}
  hide('loading');

  if (session && session.access_token) {
    accessToken = session.access_token;
    currentUser = session.user;
    await loadProfile();
    if (joinChallengeId) { await showJoinScreen(); return; }
    showApp();
  } else {
    if (joinChallengeId) { await showJoinScreen(); return; }
    show('auth-screen');
  }
}

async function loadProfile() {
  try {
    const data = await dbGetOne('profiles', 'id=eq.' + currentUser.id);
    currentProfile = data;
    if (currentProfile) document.getElementById('nav-username').textContent = currentProfile.name;
  } catch(e) {}
}

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(function(t, i) {
    t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1));
  });
  toggle('login-form', tab==='login');
  toggle('register-form', tab==='register');
  hide('auth-error'); hide('auth-success');
}

async function login() {
  const email = val('login-email'), password = val('login-password');
  if (!email || !password) return showAuthError('Заполни все поля');
  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';
  const data = await authSignIn(email, password);
  btn.disabled = false; btn.textContent = 'Войти →';
  if (!data.access_token) return showAuthError('Неверный email или пароль');
  accessToken = data.access_token;
  currentUser = data.user;
  localStorage.setItem('spor_session', JSON.stringify(data));
  await loadProfile();
  if (joinChallengeId) { await showJoinScreen(); return; }
  hide('auth-screen'); showApp();
}

async function register() {
  const name = val('reg-name'), email = val('reg-email'), password = val('reg-password');
  if (!name || !email || !password) return showAuthError('Заполни все поля');
  if (password.length < 6) return showAuthError('Пароль минимум 6 символов');
  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';
  const up = await authSignUp(email, password);
  if (up.error) { btn.disabled=false; btn.textContent='Создать аккаунт →'; return showAuthError(up.error.message||up.msg||'Ошибка'); }
  const session = await authSignIn(email, password);
  btn.disabled = false; btn.textContent = 'Создать аккаунт →';
  if (!session.access_token) return showAuthError('Ошибка входа после регистрации');
  accessToken = session.access_token;
  currentUser = session.user;
  localStorage.setItem('spor_session', JSON.stringify(session));
  try { await dbUpsert('profiles', { id: currentUser.id, name: name, email: email }); } catch(e) {}
  await loadProfile();
  if (joinChallengeId) { await showJoinScreen(); return; }
  hide('auth-screen'); showApp();
}

async function logout() {
  localStorage.removeItem('spor_session');
  accessToken = null; currentUser = null; currentProfile = null;
  hide('app'); show('auth-screen');
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; show('auth-error'); hide('auth-success');
}

async function showJoinScreen() {
  hide('auth-screen'); hide('app'); show('join-screen');
  const ch = await dbGetOne('challenges', 'id=eq.' + joinChallengeId + '&select=*,profiles(name)');
  if (!ch) { document.getElementById('join-challenge-title').textContent = 'Челлендж не найден'; return; }
  document.getElementById('join-challenge-title').textContent = ch.title;
  document.getElementById('join-challenge-desc').textContent = ch.description || '';
  document.getElementById('join-meta').innerHTML = '<div class="meta-row" style="justify-content:center"><div class="meta-chip">📅 ' + ch.duration_days + ' дней</div>' + (ch.stake ? '<div class="meta-chip stake">💸 ' + ch.stake + ' ₽</div>' : '') + '</div>';
  if (!currentUser) {
    document.getElementById('join-btn').textContent = 'Войти и принять вызов →';
    document.getElementById('join-btn').onclick = function() { hide('join-screen'); show('auth-screen'); };
  }
}

async function joinChallenge() {
  if (!currentUser) { hide('join-screen'); show('auth-screen'); return; }
  const existing = await dbGetOne('participants', 'challenge_id=eq.' + joinChallengeId + '&user_id=eq.' + currentUser.id);
  if (!existing) {
    try { await dbInsert('participants', { challenge_id: joinChallengeId, user_id: currentUser.id }); } catch(e) {}
  }
  history.replaceState({}, '', window.location.pathname);
  hide('join-screen'); showApp(); showScreen('home'); toast('🎉 Ты в игре! Удачи!');
}

function showApp() { show('app'); showScreen('home'); }

function showScreen(name) {
  ['home','explore','create','detail','profile'].forEach(function(s) { hide('screen-'+s); });
  show('screen-'+name);
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
  const navEl = document.getElementById('nav-'+name);
  if (navEl) navEl.classList.add('active');
  if (name==='home') loadHome();
  else if (name==='explore') loadExplore();
  else if (name==='profile') loadProfileScreen();
}

async function loadHome() {
  const el = document.getElementById('home-list');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Загружаем...</div>';
  const parts = await dbGet('participants', 'user_id=eq.' + currentUser.id + '&select=*,challenges(*)');
  if (!parts || !parts.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-title">Нет активных челленджей</div><div class="empty-desc">Создай первый вызов или присоединись к чужому</div></div>';
    return;
  }
  const cards = [];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const ch = p.challenges;
    const count = await dbCount('checkins', 'challenge_id=eq.' + ch.id + '&user_id=eq.' + currentUser.id);
    const pct = Math.round((count / ch.duration_days) * 100);
    const isCreator = ch.creator_id === currentUser.id;
    cards.push('<div class="challenge-card" onclick="showDetail('' + ch.id + '')">' +
      '<div class="ch-card-header"><div class="ch-card-title">' + ch.title + '</div>' +
      '<div class="ch-card-status ' + (isCreator?'status-my':'status-active') + '">' + (isCreator?'МОЙ':'УЧАСТВУЮ') + '</div></div>' +
      (ch.description ? '<div class="ch-card-desc">' + ch.description.slice(0,80) + (ch.description.length>80?'…':'') + '</div>' : '') +
      '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label"><span>' + count + ' из ' + ch.duration_days + ' дней</span><span>' + pct + '%</span></div></div>' +
      '<div class="ch-card-meta"><span>📅 ' + ch.duration_days + ' дн.</span>' + (ch.stake?'<span>💸 ' + ch.stake + ' ₽</span>':'') + '</div></div>');
  }
  el.innerHTML = cards.join('');
}

async function loadExplore() {
  const el = document.getElementById('explore-list');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Загружаем...</div>';
  const challenges = await dbGet('challenges', 'select=*,profiles(name)&order=created_at.desc&limit=30');
  if (!challenges || !challenges.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Пока пусто</div><div class="empty-desc">Стань первым — создай челлендж!</div></div>';
    return;
  }
  const cards = [];
  for (let i = 0; i < challenges.length; i++) {
    const ch = challenges[i];
    const count = await dbCount('participants', 'challenge_id=eq.' + ch.id);
    cards.push('<div class="challenge-card" onclick="showDetail('' + ch.id + '')">' +
      '<div class="ch-card-header"><div class="ch-card-title">' + ch.title + '</div><div class="ch-card-status status-active">ОТКРЫТ</div></div>' +
      (ch.description ? '<div class="ch-card-desc">' + ch.description.slice(0,80) + (ch.description.length>80?'…':'') + '</div>' : '') +
      '<div class="ch-card-meta"><span>📅 ' + ch.duration_days + ' дн.</span><span>👥 ' + count + ' участн.</span>' +
      (ch.stake?'<span>💸 ' + ch.stake + ' ₽</span>':'') + '<span>👤 ' + ((ch.profiles&&ch.profiles.name)||'Аноним') + '</span></div></div>');
  }
  el.innerHTML = cards.join('');
}

async function showDetail(id) {
  showScreen('detail');
  const el = document.getElementById('screen-detail');
  el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">Загружаем...</div>';
  const ch = await dbGetOne('challenges', 'id=eq.' + id + '&select=*,profiles(name)');
  const parts = await dbGet('participants', 'challenge_id=eq.' + id + '&select=*,profiles(name,id)');
  const myCheckins = await dbGet('checkins', 'challenge_id=eq.' + id + '&user_id=eq.' + currentUser.id + '&select=date');
  const checkedDates = {};
  (myCheckins||[]).forEach(function(c) { checkedDates[c.date] = true; });
  const today = new Date().toISOString().split('T')[0];
  const checkedToday = !!checkedDates[today];
  const isParticipant = (parts||[]).some(function(p) { return p.user_id === currentUser.id; });
  const shareUrl = window.location.origin + window.location.pathname + '?join=' + id;
  const colors = ['#e8ff47','#ff8c69','#69d5ff','#c469ff','#69ffb4'];
  const pRows = [];
  for (let i = 0; i < (parts||[]).length; i++) {
    const p = parts[i];
    const count = await dbCount('checkins', 'challenge_id=eq.' + id + '&user_id=eq.' + p.user_id);
    const color = colors[i % colors.length];
    const initials = ((p.profiles&&p.profiles.name)||'А').slice(0,2).toUpperCase();
    const isMe = p.user_id === currentUser.id;
    pRows.push('<div class="participant-row"><div class="participant-avatar" style="background:' + color + '">' + initials + '</div>' +
      '<div class="participant-name">' + ((p.profiles&&p.profiles.name)||'Участник') + (isMe?' (ты)':'') + '</div>' +
      '<div class="participant-streak"><span class="streak-fire">🔥</span>' + count + ' дней</div></div>');
  }
  el.innerHTML = '<div class="detail-header">' +
    '<button class="back-btn" onclick="showScreen('home')">← Назад</button>' +
    '<div class="detail-title">' + ch.title + '</div>' +
    (ch.description ? '<div class="detail-desc">' + ch.description + '</div>' : '') +
    '<div class="meta-row"><div class="meta-chip">📅 ' + ch.duration_days + ' дней</div>' +
    (ch.stake ? '<div class="meta-chip stake">💸 ' + ch.stake + ' ₽ ставка</div>' : '') +
    '<div class="meta-chip">👤 ' + ((ch.profiles&&ch.profiles.name)||'Аноним') + '</div></div></div>' +
    (isParticipant ?
      '<div class="checkin-section"><div class="checkin-title">Выполнение за сегодня</div>' +
      '<div class="checkin-sub">' + (checkedToday?'Ты уже отметился сегодня 💪':'Сделал задание? Отметь!') + '</div>' +
      (checkedToday ? '<div class="checkin-done">✅ Отмечено на сегодня!</div>' :
        '<button class="btn btn-accent" onclick="doCheckin('' + id + '')">✅ Отметить выполнение</button>') + '</div>' :
      '<div style="margin-bottom:16px"><button class="btn btn-accent" onclick="joinFromDetail('' + id + '')">Принять вызов →</button></div>') +
    '<div style="margin-bottom:16px"><div class="section-label">Пригласить участников</div>' +
    '<div class="share-box"><div class="share-url">' + shareUrl + '</div>' +
    '<button class="share-copy" onclick="copyLink('' + shareUrl + '')">Копировать</button></div></div>' +
    '<div class="participants-section"><div class="section-label">Участники (' + (parts||[]).length + ')</div>' +
    (pRows.join('')||'<div style="color:var(--muted);font-size:13px">Пока никого</div>') + '</div>';
}

async function doCheckin(challengeId) {
  const today = new Date().toISOString().split('T')[0];
  try {
    await dbInsert('checkins', { challenge_id: challengeId, user_id: currentUser.id, date: today });
    toast('🔥 Отлично! День засчитан!');
    showDetail(challengeId);
  } catch(e) { toast('Ошибка — попробуй ещё раз'); }
}

async function joinFromDetail(id) {
  const existing = await dbGetOne('participants', 'challenge_id=eq.' + id + '&user_id=eq.' + currentUser.id);
  if (!existing) {
    try { await dbInsert('participants', { challenge_id: id, user_id: currentUser.id }); } catch(e) {}
  }
  toast('🎉 Ты в игре!'); showDetail(id);
}

function selectDays(n, btn) {
  selectedDays = n;
  document.querySelectorAll('.day-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
}

async function createChallenge() {
  const title = val('c-title'), desc = val('c-desc'), stake = parseInt(val('c-stake'))||0;
  hide('create-error');
  if (!title) { document.getElementById('create-error').textContent='Придумай название'; show('create-error'); return; }
  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';
  try {
    const result = await dbInsert('challenges', { title: title, description: desc, duration_days: selectedDays, stake: stake, creator_id: currentUser.id });
    const ch = Array.isArray(result) ? result[0] : result;
    await dbInsert('participants', { challenge_id: ch.id, user_id: currentUser.id });
    document.getElementById('c-title').value = '';
    document.getElementById('c-desc').value = '';
    document.getElementById('c-stake').value = '';
    btn.disabled = false; btn.textContent = 'Создать вызов →';
    toast('🎯 Челлендж создан!');
    showDetail(ch.id);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Создать вызов →';
    document.getElementById('create-error').textContent = 'Ошибка: ' + e.message;
    show('create-error');
  }
}

async function loadProfileScreen() {
  const el = document.getElementById('screen-profile');
  el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">Загружаем...</div>';
  const partsCount = await dbCount('participants', 'user_id=eq.' + currentUser.id);
  const createdCount = await dbCount('challenges', 'creator_id=eq.' + currentUser.id);
  const checkinsCount = await dbCount('checkins', 'user_id=eq.' + currentUser.id);
  const initials = ((currentProfile&&currentProfile.name)||'А').slice(0,2).toUpperCase();
  el.innerHTML = '<div class="profile-header"><div class="profile-avatar">' + initials + '</div>' +
    '<div class="profile-name">' + ((currentProfile&&currentProfile.name)||'Пользователь') + '</div>' +
    '<div class="profile-email">' + ((currentProfile&&currentProfile.email)||currentUser.email) + '</div></div>' +
    '<div class="stats-grid">' +
    '<div class="stat-box"><div class="stat-num accent">' + partsCount + '</div><div class="stat-label">Участвую</div></div>' +
    '<div class="stat-box"><div class="stat-num accent">' + createdCount + '</div><div class="stat-label">Создал</div></div>' +
    '<div class="stat-box"><div class="stat-num accent">' + checkinsCount + '</div><div class="stat-label">Отметок</div></div></div>' +
    '<button class="btn btn-ghost" onclick="logout()">Выйти из аккаунта</button>';
}

function copyLink(url) { navigator.clipboard.writeText(url).then(function() { toast('✅ Ссылка скопирована!'); }); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}
function val(id) { return (document.getElementById(id)&&document.getElementById(id).value&&document.getElementById(id).value.trim())||''; }
function show(id) { const el=document.getElementById(id); if(el) el.classList.remove('hidden'); }
function hide(id) { const el=document.getElementById(id); if(el) el.classList.add('hidden'); }
function toggle(id, v) { v ? show(id) : hide(id); }

init();
</script>
</body>
</html>
